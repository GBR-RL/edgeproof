name: C++ runner

# Builds edgeproof-run, unit-tests its geometry and decoding, then runs it on the 960 test images
# with the exported YOLO26s (NMS-free head) and YOLO11s (NMS) and checks that it finds the same
# detections as the Python pipeline, timing each stage in both. x86-64 and ARM64, 4 vCPUs.

on:
  pull_request:
    paths: ["cpp/**", "src/edgeproof/export.py", "perf/constraints.txt", ".github/workflows/cpp.yml"]
  push:
    branches: [main]
    paths: ["cpp/**", "src/edgeproof/export.py", "perf/constraints.txt", ".github/workflows/cpp.yml"]
  workflow_dispatch:

concurrency:
  group: cpp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpp:
    name: C++ (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - name: Build and unit tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libopencv-dev
          cmake -S cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            perf/constraints.txt
      - name: Install
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[runtimes]" -c perf/constraints.txt
      - name: Cache the VisA split
        id: data
        uses: actions/cache@v4
        with:
          path: data/yolo
          key: visa-yolo-${{ hashFiles('src/edgeproof/data/visa.py') }}
      - name: Prepare VisA
        if: steps.data.outputs.cache-hit != 'true'
        run: |
          edgeproof data
          rm -rf data/raw data/visa
      - name: Export the detectors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download models-v1 -D models -p "*-det-1024.*" -p SHA256SUMS
          (cd models && grep -- "-det-1024" SHA256SUMS | sha256sum -c -)
          python - <<'PY'
          from pathlib import Path
          from edgeproof.export import export
          for name, head in (("yolo26s-det-1024", "e2e"), ("yolo11s-det-1024", "nms")):
              print(export(Path("models"), name, "onnxruntime", 1024, head))
          PY
      - name: Parity and timing
        run: |
          mkdir -p results
          images=data/yolo/detect/images/test
          for model in models/exported/yolo26s-det-1024/yolo26s-det-1024.onnx \
                       models/exported/yolo11s-det-1024/nms/yolo11s-det-1024.onnx; do
            name=$(basename "$model" .onnx)
            ./build/edgeproof-run --model "$model" --images "$images" --threads 4 \
              --out "results/cpp-$name.jsonl" | tee "results/timing-$name.json"
            python cpp/parity.py --model "$model" --images "$images" --threads 4 \
              --cpp "results/cpp-$name.jsonl" --timing "results/timing-$name.json" \
              --out "results/parity-${{ matrix.arch }}-$name.json"
          done
          lscpu | grep "Model name" | tee -a "$GITHUB_STEP_SUMMARY"
          for f in results/parity-*.json; do echo '```json' && cat "$f" && echo '```'; done >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-${{ matrix.arch }}
          path: results/
