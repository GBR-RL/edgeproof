name: Performance gate

# Rebuilds deployment variants from the trained checkpoints (release models-v1), times them on
# the runner and evaluates them on the 960 test images; fails when accuracy drops below the
# reference or latency exceeds the budget (perf/gate.yaml). x86-64 and ARM64 runners, 4 vCPUs.

on:
  pull_request:
    paths: ["src/**", "perf/**", "pyproject.toml", ".github/workflows/perf.yml"]
  push:
    branches: [main]
    paths: ["src/**", "perf/**", "pyproject.toml", ".github/workflows/perf.yml"]
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            perf/constraints.txt
      - name: Install
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[runtimes]" -c perf/constraints.txt
          lscpu | grep -E "Model name|^CPU\(s\)"
      - name: Cache the VisA split
        id: data
        uses: actions/cache@v4
        with:
          path: data/yolo
          key: visa-yolo-${{ hashFiles('src/edgeproof/data/visa.py') }}
      - name: Prepare VisA
        if: steps.data.outputs.cache-hit != 'true'
        run: |
          edgeproof data
          rm -rf data/raw data/visa
      - name: Trained checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download models-v1 -D models -p "*-det-1024.*" -p SHA256SUMS
          cd models && grep -- "-det-1024" SHA256SUMS | sha256sum -c -
      - name: Gate
        run: edgeproof gate --out results/gate-${{ matrix.arch }}.jsonl --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-${{ matrix.arch }}
          path: results/
