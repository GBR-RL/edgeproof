[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "edgeproof"
version = "0.1.0"
description = "What accuracy it costs to deploy an inspection model on edge hardware, and which route pays off"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rohiith Gettala Balachandar" }]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyyaml>=6",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas-stubs", "types-PyYAML"]

[project.scripts]
edgeproof = "edgeproof.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/edgeproof"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT", "RET", "C4"]
ignore = ["PLR0913", "PLR2004", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["edgeproof"]

[tool.ruff.lint.per-file-ignores]
"src/edgeproof/cli.py" = ["PLR0917"]

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["src/edgeproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
